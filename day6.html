<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my task</title>
</head>
<body>
    <h2> from details </h2>
    <form action="submit_html form">

    <label for="username">username:</label><br>
    <input type="text" id="user name" name="username"> <br><br>
     
    <label for="password">password:</label><br>
    <input type="password" id="password" name="password"><br><br>

    <label for="email">email:</label><br>
    <input type="email" id="email" name="email"> <br><br>

    <label for="age">age:</label><br>
    <input type="number" id="age" name="age" min="1" max="100"> <br><br>

    <label for="dob"> date of brith:</label><br>
    <input type="date" id="appt" name="appt"> <br><br>


    <label for="subscribe">subscribe</label><br>
    <input type="checkbox" id="subscribe" name="subscribe" value="yes"> <br><br>

    <label>Gender:</label><br>
  <input type="radio" id="male" name="gender" value="male">
  <label for="male">Male</label><br>
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label><br><br>

  <label for="volume">Volume:</label><br>
  <input type="range" id="volume" name="volume" min="0" max="100"><br><br>

  <label for="favcolor">Favorite Color:</label><br>
  <input type="color" id="favcolor" name="favcolor" value="#ff0000"><br><br>
  
  <label for="message">Message:</label><br>
  <textarea id="message" name="message" rows="5" cols="30"></textarea><br><br>

   <label for="country">Country:</label><br>
  <select id="country" name="country">

    <option value="india">India</option>
    <option value="usa">USA</option>
    <option value="uk">UK</option>

  </select><br><br>

  <label for="fruits">Fruits:</label><br>
  <select id="fruits" name="fruits" multiple>
    <option value="apple">Apple</option>
    <option value="banana">Banana</option>
    <option value="orange">Orange</option>
  </select><br><br>

  <label for="browser">Choose a browser:</label><br>
  <input list="browsers" id="browser" name="browser"><br>

  <datalist id="browsers">
    <option value="Chrome">
    <option value="Firefox">
    <option value="Edge">
    <option value="Safari">

  </datalist><br><br>

  <label>Sum Calculation:</label><br>
  <input type="number" id="a" value="10"><br>
  <input type="number" id="b" value="20"><br>
  <output name="result" for="a b">30</output><br><br>

    <label for="lastname">Last Name:</label><br>
    <input type="text" id="lastname" name="lastname"><br><br>

  </fieldset><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
  <input type="button" value="Click Me" onclick="alert('Hello!')"><br><br>
</form>

    </form>
</body>
</html>
